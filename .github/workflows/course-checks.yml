name: System and tutorial checks

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run offline system and tutorial checks
        run: python -B scripts/check_offline.py
      - name: Check workbench controls and safe rendering
        run: node apps/oncall/web/test_ui.cjs
